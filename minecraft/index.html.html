<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Minecraft 3D</title>
    <!-- Tailwind CSS untuk susun atur UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Fail CSS Tersuai -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-hidden select-none">

    <!-- Container Utama Canvas -->
    <div id="game-container" class="relative w-screen h-screen">
        <canvas id="webgl-canvas" class="w-full h-full block"></canvas>

        <!-- Crosshair di Tengah Skrin -->
        <div id="crosshair" class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 flex items-center justify-center">
            <div class="w-4 h-0.5 bg-white/80 absolute"></div>
            <div class="h-4 w-0.5 bg-white/80 absolute"></div>
        </div>

        <!-- Hotbar Inventori Blok -->
        <div id="hotbar" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-2 p-2 bg-slate-900/80 backdrop-blur-md border border-slate-700/80 rounded-2xl shadow-2xl">
            <div class="hotbar-slot active" data-slot="1" data-block="GRASS">
                <span class="slot-number">1</span>
                <div class="block-preview grass-preview"></div>
                <span class="block-name">Rumput</span>
            </div>
            <div class="hotbar-slot" data-slot="2" data-block="DIRT">
                <span class="slot-number">2</span>
                <div class="block-preview dirt-preview"></div>
                <span class="block-name">Tanah</span>
            </div>
            <div class="hotbar-slot" data-slot="3" data-block="STONE">
                <span class="slot-number">3</span>
                <div class="block-preview stone-preview"></div>
                <span class="block-name">Batu</span>
            </div>
            <div class="hotbar-slot" data-slot="4" data-block="WOOD">
                <span class="slot-number">4</span>
                <div class="block-preview wood-preview"></div>
                <span class="block-name">Kayu</span>
            </div>
            <div class="hotbar-slot" data-slot="5" data-block="LEAVES">
                <span class="slot-number">5</span>
                <div class="block-preview leaves-preview"></div>
                <span class="block-name">Daun</span>
            </div>
            <div class="hotbar-slot" data-slot="6" data-block="SAND">
                <span class="slot-number">6</span>
                <div class="block-preview sand-preview"></div>
                <span class="block-name">Pasir</span>
            </div>
        </div>

        <!-- Skrin Pelancar / Overlay Kunci Tetikus -->
        <div id="instructions-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center z-30 p-6 text-center">
            <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl flex flex-col items-center gap-5">
                <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-3xl">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
                        MINI MINECRAFT 3D
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Satu dunia Voxel 3D teroka & bina</p>
                </div>

                <!-- Panduan Kawalan -->
                <div class="w-full bg-slate-950/70 p-4 rounded-2xl border border-slate-800 text-xs text-left space-y-2">
                    <div class="flex justify-between items-center"><span class="text-slate-400">Bergerak:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">W A S D</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">Lompat:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">SPACE</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">Pandangan:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">Gerak Tetikus</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">Musnahkan Blok:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">Klik Kiri</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">Bina Blok:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">Klik Kanan</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">Pilih Blok:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">1 - 6 / Scroll</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400">Lepaskan Tetikus:</span> <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400">ESC</span></div>
                </div>

                <button id="start-btn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 active:scale-95 transition-all text-sm uppercase tracking-wider">
                    Klik untuk Bermain
                </button>
            </div>
        </div>
    </div>

    <!-- Fail JS Utama -->
    <script src="script.js"></script>
</body>
</html>
